name: formwork
description: >-
  Form library for Flutter: surgical per-field rebuilds, a serious
  validation engine, and any design system or state management.
version: 0.1.0
repository: https://github.com/DiegoViniciusCosta/formwork/tree/main/packages/formwork
issue_tracker: https://github.com/DiegoViniciusCosta/formwork/issues
topics:
  - form
  - forms
  - dynamic-forms
  - server-driven-ui
  - validation

environment:
  sdk: ^3.5.0
  flutter: ">=3.35.0"

# Nothing but Flutter and formwork's own core, on purpose: every
# dependency here becomes a potential version conflict in every app that
# uses the package.
dependencies:
  flutter:
    sdk: flutter
  formwork_core: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
