include: package:lints/recommended.yaml

analyzer:
  # Fixtures that must not compile; test/compile_errors_test.dart checks
  # the diagnostics they produce.
  exclude:
    - test/compile_errors/**
  language:
    strict-casts: false
    strict-raw-types: true

linter:
  rules:
    - public_member_api_docs
    - prefer_final_locals
    - prefer_single_quotes
